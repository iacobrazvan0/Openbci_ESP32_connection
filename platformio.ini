[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1

[env:native]
platform = native
platform_packages = platformio/toolchain-gccmingw32@^1.40900.0
extra_scripts = pre:scripts/native_toolchain.py
build_flags = -std=gnu++11 -static -D UNITY_INCLUDE_DOUBLE
test_framework = unity
test_build_src = yes
build_src_filter = +<GanglionDecoder.cpp> -<main.cpp> -<GanglionBLE.cpp> -<SerialTransport.cpp>


